<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northwind Atlas</title>
<link rel="stylesheet" href="app-1.css">
<link rel="stylesheet" href="app-2.css">
</head>
<body>
<div id="gate" aria-live="polite">
  <div id="gate-nebula"></div>
  <div id="gate-stars"></div>
  <div class="gate-ui">
    <h1>Northwind Atlas</h1>
    <div class="sub">Open knowledge surface · research desk</div>
    <div class="gate-card"><h2>Mission</h2>
      <p>Public knowledge desk. Space is only the backdrop. Scroll down for access.</p></div>
    <div class="gate-card"><h2>Break time</h2>
      <p><a class="gate-link" href="https://subwaysurfers76.github.io/" target="_blank" rel="noopener">Entertain yourself</a></p></div>
    <div class="gate-access">
      <label>Restricted desk unlock</label>
      <p style="font-size:12px;color:#888;text-align:left">HWID <b style="color:#ccc">1</b> · SHA-256 password</p>
      <div class="gate-row">
        <input id="gate-hw" type="text" value="1" readonly style="max-width:72px;text-align:center"/>
        <input id="gate-code" type="password" placeholder="Password"/>
        <button type="button" id="gate-go">Unlock</button>
      </div>
      <div class="gate-err" id="gate-err"></div>
      <div id="gate-owner"></div>
    </div>
    <div class="gate-foot">NORTHWIND ATLAS</div>
  </div>
</div>
<div id="desk"><div class="icons" id="icons"></div></div>
<div id="menu">
  <div class="lh"><input id="lq" placeholder="Search apps"/></div>
  <div id="apps"></div>
  <div class="lf">
    <button type="button" id="theme">Theme</button>
    <button type="button" id="bgbtn">Background</button>
  </div>
</div>
<div id="task">
  <button type="button" id="start" aria-label="Start">⊞</button>
  <div id="pins"></div>
  <div id="tbs" style="display:flex;gap:6px;overflow-x:auto"></div>
  <div id="clock"></div><button id="prof" aria-label="Profile"></button>
</div>
<script src="boot.js"></script>
</body>
</html>
