<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Search</title>
<style>
html,body{margin:0;height:100%;background:#fff;color:#111;font:15px system-ui}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#drift-fail{display:none;position:fixed;inset:0;z-index:6;background:#0e1016;color:#fff;font:15px system-ui,sans-serif}
#drift-fail.on{display:block}
#drift-fail canvas{position:absolute;inset:0;width:100%;height:100%}
#drift-fail .note{position:absolute;left:16px;top:16px;z-index:2}
</style>
</head>
<body>
<div id="drift-fail"><div class="note"><b>Loading…</b><div style="opacity:.75;margin-top:4px">Retrying until the page opens. Works on Chromebook, Windows and mobile.</div></div><canvas id="cube" style="width:100%;height:100%"></canvas></div>
<script>
(async function () {
  function unwrap(raw) {
    var href = String(raw || '');
    for (var n = 0; n < 5; n++) {
      var next = href;
      try {
        var u = new URL(href, location.href);
        var path = u.pathname + u.search;
        var at = path.indexOf('/scramjet/');
        if (at !== -1) {
          var rest = path.slice(at + 10);
          try { rest = decodeURIComponent(rest); } catch (e) {}
          if (/^https?:/i.test(rest)) next = rest;
        } else if (/\/go$/i.test(u.pathname) && u.searchParams.get('u')) {
          next = u.searchParams.get('u');
        }
      } catch (e) {}
      if (next === href) break;
      href = next;
    }
    return href;
  }
  function searched(raw) {
    var href = unwrap(raw);
    var blob = href;
    try { blob += '\n' + decodeURIComponent(href); } catch (e) {}
    try { blob += '\n' + decodeURIComponent(decodeURIComponent(href)); } catch (e2) {}
    var found = '';
    var bits = String(blob).split(/https?:\/\//i);
    for (var i = 1; i < bits.length; i++) {
      var u = ('https://' + bits[i].split(/[\s"'<>]/)[0]).replace(/[),.;]+$/, '');
      var host = '';
      try { host = new URL(u).hostname; } catch (e5) { host = u; }
      if (/linewize|classwize|goguardian|securly/i.test(host)) continue;
      found = u;
      break;
    }
    if (found) href = found;
    href = String(href).replace(/[?#&](?:user|userid|user_id|device|deviceid|device_id|hardware|hardwareid|hwid|hw_id|token|session|sid|school|org|policy|reason|category)=[^&#]*/gi, '');
    var q = '';
    try {
      var uu = new URL(href);
      q = uu.searchParams.get('q') || uu.searchParams.get('query') || uu.searchParams.get('search_query') || uu.searchParams.get('search') || uu.searchParams.get('keyword') || '';
    } catch (e3) {}
    if (!q) {
      var qm = String(blob).match(/[?&](?:q|query|search_query|keyword)=([^&#]+)/i);
      if (qm) { try { q = decodeURIComponent(qm[1].replace(/\+/g, ' ')); } catch (e4) { q = qm[1]; } }
    }
    q = String(q || '').replace(/\s+/g, ' ').trim();
    if (q) return 'https://duckduckgo.com/?kl=mx-es&ia=web&q=' + encodeURIComponent(q);
    if (/^https?:/i.test(href) && !/linewize|classwize|goguardian|securly/i.test(href)) return href;
    return 'https://duckduckgo.com/?kl=mx-es';
  }
  var params = new URLSearchParams(location.search);
  var target = searched(params.get('u') || '');
  var guest = params.get('guest') === '1';
  try {
    var u = new URL(target);
    if ((guest || u.searchParams.get('guest') === '1') && /google\./i.test(u.hostname)) u.searchParams.set('igu', '1');
    u.searchParams.delete('guest');
    target = u.toString();
  } catch (e) {}
  function load(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error(src)); };
      document.head.appendChild(s);
    });
  }
  var fail = document.getElementById('drift-fail');
  var playing = false;
  var stopGame = function () {};
  function cube() {
    if (playing) return;
    playing = true;
    var cv = document.getElementById('cube');
    var ctx = cv.getContext('2d');
    var y = 0, vy = 0, dead = false, score = 0, best = 0, coins = 0, tickN = 0, raf = 0, started = false, shake = 0;
    var obs = [], flakes = [], far = [], coinsA = [], dust = [];
    try { best = Number(sessionStorage.getItem('wos:cube-best') || 0) || 0; } catch (e) {}
    function size() {
      var w0 = Math.max(320, cv.clientWidth || innerWidth), h0 = Math.max(220, cv.clientHeight || innerHeight);
      if (cv.width !== w0) cv.width = w0;
      if (cv.height !== h0) cv.height = h0;
      return { w: cv.width, h: cv.height };
    }
    function reset() {
      var box = size();
      y = box.h - 118; vy = 0; dead = false; started = false; score = 0; coins = 0; tickN = 0; shake = 0;
      obs = []; flakes = []; far = []; coinsA = []; dust = [];
      var i;
      for (i = 0; i < 7; i++) far.push({ x: Math.random() * box.w, h: 40 + Math.random() * 90, w: 70 + Math.random() * 80 });
      for (i = 0; i < 46; i++) flakes.push({ x: Math.random() * box.w, y: Math.random() * box.h, r: 0.6 + Math.random() * 1.8, v: 0.45 + Math.random() * 1.3, o: 0.35 + Math.random() * 0.55 });
    }
    function jump() {
      if (dead) { reset(); return; }
      started = true;
      var box = size();
      if (y >= box.h - 122) {
        vy = -10.4;
        var k;
        for (k = 0; k < 6; k++) dust.push({ x: 92, y: y + 18, vx: -1.2 - Math.random() * 2, vy: -Math.random() * 1.4, l: 16 });
      }
    }
    function onKey(e) {
      if (e.code !== 'Space' && e.key !== ' ' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      jump();
    }
    cv.addEventListener('pointerdown', jump);
    window.addEventListener('keydown', onKey);
    reset();
    function ridge(px, ground, ph, wide, fill) {
      ctx.beginPath();
      ctx.moveTo(px, ground);
      ctx.lineTo(px + wide * 0.42, ground - ph * 0.62);
      ctx.lineTo(px + wide * 0.7, ground - ph);
      ctx.lineTo(px + wide * 1.15, ground - ph * 0.48);
      ctx.lineTo(px + wide * 1.55, ground);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(px + wide * 0.52, ground - ph * 0.78);
      ctx.lineTo(px + wide * 0.7, ground - ph);
      ctx.lineTo(px + wide * 0.9, ground - ph * 0.7);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fill();
    }
    function frame() {
      if (!fail.classList.contains('on')) { cancelAnimationFrame(raf); return; }
      var box = size();
      var ground = box.h - 54;
      tickN++;
      if (shake > 0) shake *= 0.86;
      ctx.save();
      if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      var sky = ctx.createLinearGradient(0, 0, 0, ground);
      sky.addColorStop(0, '#06101f');
      sky.addColorStop(0.45, '#1a4b86');
      sky.addColorStop(1, '#f3d7b0');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, box.w, box.h);
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      var fi;
      for (fi = 0; fi < flakes.length; fi++) {
        var flake = flakes[fi];
        flake.y += flake.v;
        flake.x += Math.sin((tickN + fi) / 30) * 0.25;
        if (flake.y > ground) { flake.y = -4; flake.x = Math.random() * box.w; }
        ctx.globalAlpha = flake.o;
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, 6.3);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      var speed = started && !dead ? 4.6 + Math.min(5.5, score / 28) : 1.2;
      var bi;
      for (bi = 0; bi < far.length; bi++) {
        var hill = far[bi];
        hill.x -= speed * 0.18;
        if (hill.x < -hill.w) hill.x = box.w + 20;
        ridge(hill.x, ground, hill.h * 0.55, hill.w, 'rgba(90,120,160,.35)');
      }
      var snowG = ctx.createLinearGradient(0, ground - 8, 0, box.h);
      snowG.addColorStop(0, '#f7fbff');
      snowG.addColorStop(1, '#8ea4bf');
      ctx.fillStyle = '#16324d';
      ctx.fillRect(0, ground + 8, box.w, box.h);
      ctx.fillStyle = snowG;
      ctx.fillRect(0, ground - 2, box.w, 14);
      if (started && !dead) {
        vy += 0.46;
        y += vy;
        if (y > ground - 28) { y = ground - 28; vy = 0; }
        if (tickN % Math.max(52, 92 - Math.floor(score / 12)) === 0) {
          var hgt = 34 + Math.random() * 86;
          obs.push({ x: box.w + 24, hgt: hgt, wide: 26 + Math.random() * 18, passed: false });
          if (Math.random() < 0.65) coinsA.push({ x: box.w + 70, y: ground - hgt - 36 - Math.random() * 20, got: false });
        }
      }
      var i;
      for (i = 0; i < obs.length; i++) {
        obs[i].x -= speed;
        ridge(obs[i].x, ground + 6, obs[i].hgt, obs[i].wide, '#6d8caf');
        var top = ground - obs[i].hgt + 16;
        var left = obs[i].x + obs[i].wide * 0.35;
        var right = obs[i].x + obs[i].wide * 1.05;
        if (started && !dead && 78 < right && 78 + 22 > left && y < top + obs[i].hgt - 18 && y + 22 > top + 8) {
          dead = true;
          shake = 10;
        }
        if (!obs[i].passed && obs[i].x + obs[i].wide < 70) { obs[i].passed = true; score += 1; }
      }
      obs = obs.filter(function (o) { return o.x > -120; });
      for (i = 0; i < coinsA.length; i++) {
        var coin = coinsA[i];
        coin.x -= speed;
        if (!coin.got) {
          ctx.fillStyle = '#ffe56a';
          ctx.beginPath();
          ctx.arc(coin.x, coin.y + Math.sin(tickN / 8 + i) * 3, 6, 0, 6.3);
          ctx.fill();
          if (started && !dead && Math.abs(coin.x - 88) < 16 && Math.abs(coin.y - (y + 8)) < 16) {
            coin.got = true;
            coins++;
            score += 3;
          }
        }
      }
      coinsA = coinsA.filter(function (c) { return c.x > -20 && !c.got; });
      if (score > best) { best = score; try { sessionStorage.setItem('wos:cube-best', String(best)); } catch (e2) {} }
      for (i = dust.length - 1; i >= 0; i--) {
        var p = dust[i];
        p.x += p.vx; p.y += p.vy; p.l--;
        ctx.globalAlpha = Math.max(0, p.l / 16);
        ctx.fillStyle = '#fff';
        ctx.fillRect(p.x, p.y, 3, 3);
        if (p.l <= 0) dust.splice(i, 1);
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(86, y + 12);
      ctx.rotate(!dead && vy < -0.4 ? -0.35 : (vy > 1 ? 0.25 : 0));
      ctx.fillStyle = '#7ec8ff';
      ctx.fillRect(-12, -12, 22, 22);
      ctx.fillStyle = '#e8f4ff';
      ctx.fillRect(-12, -12, 7, 22);
      ctx.restore();
      ctx.fillStyle = '#fff';
      ctx.font = '700 18px system-ui';
      ctx.fillText(String(score), 16, 28);
      ctx.font = '13px system-ui';
      ctx.fillText('best ' + best + '   coins ' + coins, 16, 48);
      if (!started) {
        ctx.font = '700 20px system-ui';
        ctx.fillText('Tap or space — jump the peaks', 16, box.h * 0.38);
      }
      if (dead) {
        ctx.fillStyle = 'rgba(6,16,31,.5)';
        ctx.fillRect(0, 0, box.w, box.h);
        ctx.fillStyle = '#fff';
        ctx.font = '800 28px system-ui';
        ctx.fillText('Wiped out', box.w * 0.5 - 70, box.h * 0.42);
      }
      ctx.restore();
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    stopGame = function () { cancelAnimationFrame(raf); window.removeEventListener('keydown', onKey); playing = false; };
  }
  function showFail() {
    fail.classList.add('on');
    cube();
  }
  function hideFail() {
    fail.classList.remove('on');
    stopGame();
  }
  showFail();
  try {
    await load('/scram/scramjet.all.js');
    await load('/baremux/index.js');
    var C = $scramjetLoadController().ScramjetController;
    var stores = ['config', 'cookies', 'redirectTrackers', 'referrerPolicies', 'publicSuffixList'];
    function openScramjetDB() {
      return new Promise(function (res, rej) {
        var req = indexedDB.open('$scramjet', 1);
        req.onupgradeneeded = function () {
          var db = req.result;
          stores.forEach(function (name) {
            if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
          });
        };
        req.onsuccess = function () { res(req.result); };
        req.onerror = function () { rej(req.error); };
      });
    }
    var existing = await openScramjetDB();
    var missing = stores.some(function (name) { return !existing.objectStoreNames.contains(name); });
    existing.close();
    if (missing) {
      await new Promise(function (res, rej) {
        var del = indexedDB.deleteDatabase('$scramjet');
        del.onsuccess = function () { res(); };
        del.onerror = function () { rej(del.error); };
      });
      (await openScramjetDB()).close();
    }
    var SJC = new C({ files: { wasm: '/scram/scramjet.wasm.wasm', all: '/scram/scramjet.all.js', sync: '/scram/scramjet.sync.js' } });
    await SJC.init();
    if (navigator.serviceWorker) {
      await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
      await navigator.serviceWorker.ready;
    }
    var conn = new BareMux.BareMuxConnection('/baremux/worker.js');
    var wisp = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/';
    if ((await conn.getTransport()) !== '/libcurl/index.mjs') await conn.setTransport('/libcurl/index.mjs', [{ websocket: wisp }]);
    var frame = SJC.createFrame();
    frame.frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff';
    document.body.appendChild(frame.frame);
    var n = 0;
    function bad() {
      try {
        var doc = frame.frame.contentDocument;
        var title = doc && doc.getElementById && doc.getElementById('errorTitle');
        return !!(title && /uh oh/i.test(title.textContent || ''));
      } catch (e) { return false; }
    }
    function ready() {
      try {
        var doc = frame.frame.contentDocument;
        if (!doc || !doc.body) return false;
        var title = doc.getElementById && doc.getElementById('errorTitle');
        if (title && /uh oh/i.test(title.textContent || '')) return false;
        var text = String(doc.body.innerText || '').replace(/\s+/g, ' ').trim();
        if (/request blocked|403 error|generated by cloudfront|access denied|refused to connect/i.test(text) && text.length < 500) return false;
        if (text.length > 80) return true;
        if (doc.querySelector('input[name="q"], #search_form_input, form, img, video, article, a')) return true;
        return false;
      } catch (e) { return false; }
    }
    function kick() {
      showFail();
      try { frame.frame.style.visibility = 'hidden'; } catch (e) {}
      try { frame.go(target); } catch (e) {}
      var ticks = 0;
      var timer = setInterval(function () {
        ticks++;
        if (bad()) {
          try { frame.frame.style.visibility = 'hidden'; } catch (e2) {}
          showFail();
          clearInterval(timer);
          if (n < 40) { n++; setTimeout(kick, 450); }
          return;
        }
        if (ready() || ticks > 80) {
          try { frame.frame.style.visibility = ''; } catch (e3) {}
          hideFail();
          clearInterval(timer);
        }
      }, 250);
    }
    kick();
  } catch (err) {
    showFail();
    var note = fail.querySelector('.note');
    if (note) note.lastChild.textContent = 'The search could not start.';
  }
})();
</script>
<style>
#drift-pass{position:fixed;right:12px;bottom:12px;z-index:8;width:min(340px,calc(100% - 24px));max-height:78vh;overflow:auto;color:#111;border-radius:22px;padding:12px;font:13px/1.4 system-ui,sans-serif;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.48);box-shadow:0 12px 40px rgba(0,0,0,.18);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
#drift-pass input,#drift-pass select,#drift-pass textarea{width:100%;box-sizing:border-box;margin-top:4px;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.5);color:#111}
#drift-pass button{border:0;border-radius:10px;background:#c5c8ce;color:#111;font-weight:700;padding:8px 10px;cursor:pointer}
#drift-pass [data-head] button{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.55)}
</style>
<div id="drift-pass">

      <label style="display:block;margin-top:8px">ALEKS<input data-k="wos:kb-aleks" placeholder="shortcut"></label>
      <label style="display:block;margin-top:8px">Google Docs<input data-k="wos:kb-docs" placeholder="shortcut"></label>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>Education mode</b><input type="checkbox" data-k="wos:edu-mode" style="width:auto"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>AI assistant</b><input type="checkbox" data-orb style="width:auto"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>Google Lens</b><input type="checkbox" data-k="wos:lens-bypass" style="width:auto"></div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.12)">

        <div style="display:flex;gap:8px;margin-top:8px"><button type="button" data-clean-open style="flex:1">Open</button><button type="button" data-clean-random style="flex:1;background:transparent;border:1px solid rgba(0,0,0,.2)">Random</button></div>
      </div>
      <button type="button" data-ia style="width:100%;margin-top:12px">Open IA chat</button>
    </div>
    <div data-chat hidden>
      <div data-log style="min-height:72px;max-height:180px;overflow:auto;white-space:pre-wrap"></div>
      <img data-preview alt="" hidden style="max-width:100%;border-radius:12px;margin-top:6px">
      <input data-photo type="file" accept="image/*" style="margin-top:8px">
      <textarea data-ai placeholder="Text only" style="min-height:64px"></textarea>
      <button type="button" data-ask style="width:100%;margin-top:8px">Send</button>
    </div>
  </div>
</div>
<button id="drift-pass-peek" type="button" style="display:none;position:fixed;right:10px;bottom:10px;z-index:9;border:0;border-radius:999px;background:rgba(255,255,255,.72);color:#111;padding:8px 12px;font:700 12px system-ui;cursor:pointer;backdrop-filter:blur(12px)">Show</button>
<button id="drift-go-ball" type="button" hidden style="position:fixed;right:18px;bottom:88px;z-index:9;width:68px;height:68px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:#071226;overflow:hidden;cursor:grab"><img src="/drift-mark.png" alt="" style="width:100%;height:100%;object-fit:cover;transform:scale(1.18);pointer-events:none"></button>
<script>
(function () {
  var bar = document.getElementById('drift-pass');
  var peek = document.getElementById('drift-pass-peek');
  var ball = document.getElementById('drift-go-ball');
  if (!bar) return;
  var body = bar.querySelector('[data-body]');
  var settings = bar.querySelector('[data-settings]');
  var chat = bar.querySelector('[data-chat]');
  var toggle = bar.querySelector('[data-toggle]');
  var photoUrl = '';
  function mode(m) {
    try { localStorage.setItem('wos:pass-bar', m); } catch (e) {}
    var off = m === 'off';
    var open = m !== 'mini' && !off;
    bar.style.display = off ? 'none' : 'block';
    if (body) body.style.display = open ? '' : 'none';
    if (toggle) toggle.textContent = open ? 'Close' : 'Open';
    if (peek) peek.style.display = 'none';
  }
  var saved = 'full';
  try { saved = localStorage.getItem('wos:pass-bar') || 'full'; } catch (e) {}
  if (saved === 'full') saved = 'full';
  mode(saved === 'off' ? 'off' : (saved === 'mini' ? 'mini' : 'full'));
  if (toggle) toggle.onclick = function () {
    var open = body && body.style.display !== 'none' && bar.style.display !== 'none';
    mode(open ? 'mini' : 'full');
  };
  bar.querySelector('[data-kill]').onclick = function () { mode('off'); };
  if (peek) {
    peek.onclick = function () { mode('full'); };
    window.addEventListener('pointermove', function (e) {
      var m = 'full';
      try { m = localStorage.getItem('wos:pass-bar') || 'full'; } catch (err) {}
      if (m !== 'off') { peek.style.display = 'none'; return; }
      peek.style.display = (e.clientX > innerWidth - 120 && e.clientY > innerHeight - 80) ? 'block' : 'none';
    });
  }
  bar.querySelectorAll('[data-k]').forEach(function (el) {
    var k = el.getAttribute('data-k');
    try { if (el.type === 'checkbox') el.checked = localStorage.getItem(k) === '1'; else el.value = localStorage.getItem(k) || ''; } catch (e) {}
    el.onchange = function () { try { localStorage.setItem(k, el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value); } catch (e) {} };
  });
  function orbOn(on) {
    try { localStorage.setItem('wos:go-orb', on ? '1' : '0'); } catch (e) {}
    try { localStorage.setItem('wos:ai-orb', on ? '1' : '0'); } catch (e) {}
    if (ball) ball.hidden = !on;
  }
  var orb = bar.querySelector('[data-orb]');
  if (orb) {
    try { orb.checked = localStorage.getItem('wos:go-orb') === '1' || localStorage.getItem('wos:ai-orb') === '1'; } catch (e) {}
    orbOn(orb.checked);
    orb.onchange = function () { orbOn(orb.checked); };
  }
  var drag = null;
  if (ball) {
    ball.addEventListener('pointerdown', function (e) {
      drag = { x: e.clientX, y: e.clientY, l: ball.offsetLeft, t: ball.offsetTop, moved: false };
    });
    window.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      ball.style.left = (drag.l + dx) + 'px';
      ball.style.top = (drag.t + dy) + 'px';
      ball.style.right = 'auto';
      ball.style.bottom = 'auto';
    });
    window.addEventListener('pointerup', function () {
      if (drag && !drag.moved) {
        mode('full');
        if (settings) settings.hidden = true;
        if (chat) chat.hidden = false;
        var ia = bar.querySelector('[data-ia]');
        if (ia) ia.textContent = 'Settings';
      }
      drag = null;
    });
  }
  var sites = { docs: 'https://docs.google.com/', discovery: 'https://www.discoveryeducation.com/', classroom: 'https://classroom.google.com/', canva: 'https://www.canva.com/', other: 'https://en.wikipedia.org/' };
  function openClean(list) {
    var blocked = false;
    list.forEach(function (u) { var w = null; try { w = window.open(u, '_blank', 'popup,width=1100,height=760'); } catch (e) { w = null; } if (!w) blocked = true; });
    var btn = bar.querySelector('[data-clean-open]');
    if (!btn) return;
    if (blocked) { btn.hidden = false; btn.textContent = 'Allow pop-ups, then press Open'; }
    else btn.hidden = true;
  }
  bar.querySelector('[data-clean-open]').onclick = function () {
    var site = bar.querySelector('[data-clean-site]').value;
    var n = parseInt(bar.querySelector('[data-clean-n]').value, 10) || 1;
    if (n < 1) n = 1;
    if (n > 20) n = 20;
    var list = [];
    for (var i = 0; i < n; i++) list.push(sites[site] || sites.other);
    openClean(list);
  };
  bar.querySelector('[data-clean-random]').onclick = function () {
    var list = [sites.docs, sites.discovery, sites.classroom, sites.canva];
    for (var i = list.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = list[i]; list[i] = list[j]; list[j] = t; }
    openClean(list);
  };
  bar.querySelector('[data-ia]').onclick = function () {
    var showChat = settings && !settings.hidden;
    if (settings) settings.hidden = showChat;
    if (chat) chat.hidden = !showChat;
    this.textContent = showChat ? 'Settings' : 'Open IA chat';
  };
  bar.querySelector('[data-photo]').onchange = function () {
    var file = this.files && this.files[0];
    photoUrl = '';
    var img = bar.querySelector('[data-preview]');
    if (!file) { if (img) img.hidden = true; return; }
    var reader = new FileReader();
    reader.onload = function () {
      photoUrl = String(reader.result || '');
      if (img) { img.src = photoUrl; img.hidden = false; }
    };
    reader.readAsDataURL(file);
  };
  bar.querySelector('[data-ask]').onclick = async function () {
    var q = bar.querySelector('[data-ai]').value.trim();
    var log = bar.querySelector('[data-log]');
    if (!q && !photoUrl) return;
    bar.querySelector('[data-ai]').value = '';
    log.textContent = (log.textContent ? log.textContent + '\n' : '') + (q || 'Photo');
    var content = photoUrl ? [{ type: 'text', text: q || 'What is in this photo?' }, { type: 'image_url', image_url: { url: photoUrl } }] : (q || 'Hello');
    photoUrl = '';
    var img = bar.querySelector('[data-preview]');
    if (img) img.hidden = true;
    try {
      var r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'smart', max_tokens: 1200, messages: [{ role: 'user', content: content }], system: 'You are Drift. Reply with text only. Never write code and never use a fenced block. Answer in the user language. Be complete.' }) });
      var j = await r.json();
      var text = ((j.content || []).map(function (x) { return x.text || ''; }).join('')) || 'No answer.';
      log.textContent += '\n' + text.replace(/```[\s\S]*?```/g, '').trim();
    } catch (e) { log.textContent += '\nNo answer.'; }
  };
  function keyHit(spec, e) {
    spec = String(spec || '').trim().toLowerCase();
    if (!spec) return false;
    var key = String(e.key || '').toLowerCase();
    var code = String(e.code || '').toLowerCase();
    if (spec === key || spec === code || spec === code.replace(/^key/, '')) return true;
    var parts = spec.split('+').map(function (s) { return s.trim(); }).filter(Boolean);
    if (parts.length < 2) return false;
    var last = parts[parts.length - 1];
    if (last !== key && last !== code && ('key' + last) !== code) return false;
    for (var i = 0; i < parts.length - 1; i++) {
      var p = parts[i];
      if ((p === 'ctrl' || p === 'control') && !e.ctrlKey) return false;
      else if (p === 'alt' && !e.altKey) return false;
      else if (p === 'shift' && !e.shiftKey) return false;
      else if ((p === 'meta' || p === 'cmd' || p === 'command') && !e.metaKey) return false;
    }
    return true;
  }
  window.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName || '')) return;
    var cur = '';
    try { cur = new URLSearchParams(location.search).get('u') || ''; } catch (err) {}
    var map = [
      ['wos:kb-class', 'https://classroom.google.com/'],
      ['wos:kb-docs', 'https://docs.google.com/document/u/0/'],
      ['wos:kb-disc', 'https://www.discoveryeducation.com/'],
      ['wos:kb-aleks', 'https://www.aleks.com/'],
      ['wos:kb-hide', '']
    ];
    for (var i = 0; i < map.length; i++) {
      var spec = '';
      try { spec = localStorage.getItem(map[i][0]) || ''; } catch (err2) {}
      if (!keyHit(spec, e)) continue;
      if (!map[i][1]) { try { localStorage.setItem('wos:edu-mode', '1'); } catch (err3) {} return; }
      var dest = map[i][1];
      var host = dest.replace(/^https?:\/\//, '').split('/')[0];
      if (cur.indexOf(host) !== -1) return;
      e.preventDefault();
      location.href = '/go?u=' + encodeURIComponent(dest);
      return;
    }
  });
})();
</script>
