function drag(w){

/* ---------- Calculadora ---------- */
const RATES={USD:1,EUR:.92,MXN:18,GBP:.78,JPY:150,CAD:1.36,BRL:5.4,COP:4000,ARS:1000};let ratesLive=false;
const UNITS={Longitud:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},Peso:{kg:1,g:.001,lb:.45359237,oz:.028349523},Volumen:{L:1,mL:.001,gal:3.785411784,taza:.2365882365}};
const FACT=n=>{n=Math.round(n);if(n<0||n>170)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
function calc(root,w){
  root.innerHTML='<div class="calc"><div class="cm"><button class="mb"></button><div class="mmenu"></div></div><div class="cmain"></div></div>';
  const mb=$('.mb',root),mm=$('.mmenu',root),main=$('.cmain',root);
  let mode='basic',e='',fresh=false,deg=true,hist,out;
  const NAMES={basic:'Básica',sci:'Científica',conv:'Convertir'};
  function setMode(m){mode=m;mb.textContent=NAMES[m]+' ▾';mm.classList.remove('show');if(m==='conv')conv();else pad()}
  mb.onclick=()=>{mm.innerHTML=Object.keys(NAMES).map(k=>`<button data-m="${k}"><span>${mode===k?'✓':''}</span><i>${{basic:'±',sci:'ƒ',conv:'⇄'}[k]}</i>${NAMES[k]}</button>`).join('');mm.classList.toggle('show')};
  mm.onclick=ev=>{const b=ev.target.closest('[data-m]');if(b)setMode(b.dataset.m)};
  function ev(s){
    let x=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/\be\b/g,'Math.E').replace(/√\(/g,'Math.sqrt(').replace(/sin\(/g,'SIN(').replace(/cos\(/g,'COS(').replace(/tan\(/g,'TAN(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/(\d+(?:\.\d+)?)!/g,'FACT($1)').replace(/%/g,'/100').replace(/\^/g,'**');
    const o=(x.match(/\(/g)||[]).length,c=(x.match(/\)/g)||[]).length;x+=')'.repeat(Math.max(0,o-c));
    if(!/^[\d+\-*/.()\s]*$/.test(x.replace(/Math\.(PI|E|sqrt|log10|log)|SIN|COS|TAN|FACT/g,'')))throw 0;
    const k=deg?Math.PI/180:1;
    return Function('SIN','COS','TAN','FACT','"use strict";return('+x+')')(a=>Math.sin(a*k),a=>Math.cos(a*k),a=>Math.tan(a*k),FACT);
  }
  const OP=['÷','×','−','+','^','%','!','x²','1/x','=','⌫','±','C'];
  function press(k){
    if(fresh&&!OP.includes(k))e='';
    fresh=false;
    if(k==='C'){e='';hist.textContent=''}
    else if(k==='⌫')e=e.slice(0,-1);
    else if(k==='±'){const m=e.match(/(-?[\d.]+)$/);if(m)e=e.slice(0,m.index)+(m[1][0]==='-'?m[1].slice(1):'-'+m[1])}
    else if(k==='x²')e+='^2';
    else if(k==='1/x'){if(e)e='1/('+e+')'}
    else if(k==='='){if(!e)return;try{let r=ev(e);if(!isFinite(r))throw 0;r=+r.toPrecision(12);hist.textContent=e+' =';e=String(r);fresh=true}catch{hist.textContent=e;e='Error';fresh=true}}
    else{
      if('÷×−+'.includes(k)&&(!e||e==='Error')&&k!=='−')return;
      if('÷×−+'.includes(k)&&'÷×−+'.includes(e.slice(-1)))e=e.slice(0,-1);
      if(e==='Error')e='';
      e+=k;
    }
    out.textContent=e||'0';
  }
  function pad(){
    main.innerHTML='<div class="disp"><small></small><div>0</div></div>'+(mode==='sci'?'<div class="sci"></div>':'')+'<div class="keys"></div>';
    hist=$('small',main);out=$('.disp div',main);
    const keys=$('.keys',main);
    ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].forEach(k=>{const b=document.createElement('button');b.textContent=k;if('C⌫%÷×−+'.includes(k))b.className='op';if(k==='=')b.className='eq';b.onclick=()=>press(k);keys.appendChild(b)});
    if(mode==='sci'){const s=$('.sci',main);['Deg','sin(','cos(','tan(','!','π','e','log(','ln(','x²','(',')','√(','^','1/x'].forEach(k=>{const b=document.createElement('button');b.textContent=k==='Deg'?(deg?'Deg':'Rad'):k;b.onclick=()=>{if(k==='Deg'){deg=!deg;b.textContent=deg?'Deg':'Rad'}else press(k)};s.appendChild(b)})}
    out.textContent=e||'0';
  }
  function conv(){
    main.innerHTML='<div class="cv"><select class="ct" aria-label="Categoría"></select><input class="cin2" type="number" inputmode="decimal" value="1" aria-label="Cantidad"><select class="cf" aria-label="De"></select><div class="sw">⇅</div><select class="cto" aria-label="A"></select><div class="cres">—</div><small class="cn"></small></div>';
    const ct=$('.ct',main),inp=$('.cin2',main),cf=$('.cf',main),cto=$('.cto',main),res=$('.cres',main),cn=$('.cn',main);
    ct.innerHTML=['Moneda',...Object.keys(UNITS),'Temperatura'].map(c=>`<option>${c}</option>`).join('');
    const names=()=>ct.value==='Moneda'?Object.keys(RATES):ct.value==='Temperatura'?['°C','°F','K']:Object.keys(UNITS[ct.value]);
    const calc2=()=>{const v=parseFloat(inp.value);if(isNaN(v)){res.textContent='—';return}
      let r;const a=cf.value,b=cto.value,c=ct.value;
      if(c==='Moneda')r=v/RATES[a]*RATES[b];
      else if(c==='Temperatura'){const C=a==='°C'?v:a==='°F'?(v-32)*5/9:v-273.15;r=b==='°C'?C:b==='°F'?C*9/5+32:C+273.15}
      else r=v*UNITS[c][a]/UNITS[c][b];
      res.textContent=r.toLocaleString('es',{maximumFractionDigits:6})+' '+b};
    const fill=()=>{const n=names(),h=n.map(x=>`<option>${x}</option>`).join('');cf.innerHTML=h;cto.innerHTML=h;cto.selectedIndex=Math.min(1,n.length-1);cn.textContent=ct.value==='Moneda'?(ratesLive?'Tasas en vivo':'Tasas aproximadas (sin conexión)'):'';calc2()};
    ct.onchange=fill;inp.oninput=calc2;cf.onchange=calc2;cto.onchange=calc2;
    $('.sw',main).onclick=()=>{const t=cf.value;cf.value=cto.value;cto.value=t;calc2()};
    fill();
    if(!ratesLive)fetch('https://api.frankfurter.app/latest?from=USD').then(r=>r.json()).then(j=>{Object.assign(RATES,j.rates);ratesLive=true;if(ct.isConnected&&ct.value==='Moneda')fill()}).catch(()=>{});
  }
  w.addEventListener('keydown',evn=>{if(mode==='conv')return;const m={'/':'÷','*':'×','-':'−',Enter:'=',Backspace:'⌫',Escape:'C'};const k=m[evn.key]||evn.key;if('0123456789.+%()^!'.includes(k)||['÷','×','−','=','⌫','C'].includes(k)){evn.preventDefault();press(k)}});
  w.tabIndex=0;w.style.outline='none';
  setMode('basic');
}

const DDG0="https://holy-firefly-982c.fert0480.workers.dev";
const EP=()=>(LS.get('wos:ddg','')||DDG0).replace(/\/$/,'');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function resolve(v){
  v=v.trim();if(!v)return'chrome://newtab';
  if(/^(chrome|about):/.test(v))return v.replace(/^about:/,'chrome://');
  const h=v.replace(/^https?:\/\//,'').replace(/\/$/,'');
  if(!/\s/.test(v)&&/\./.test(h))return h;
  return 'chrome://search?q='+encodeURIComponent(v);
}
function render(url){
  if(url==='chrome://newtab'||url.startsWith('chrome://')&&!url.startsWith('chrome://search'))return{t:'Nueva pestaña',h:`<div class="center"><div class="logo"><span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span></div><input class="sb" data-sb placeholder="Busca o escribe una URL" aria-label="Buscar"></div>`};
  if(url.startsWith('chrome://search')){const q=decodeURIComponent(url.split('q=')[1]||'');return{t:q+' - Búsqueda',h:`<div class="pad"><div id="ddgbox"></div></div>`}}
  const s=/^https?:/.test(url)?url:'https://'+url;
  return{t:url.replace(/^https?:\/\//,'').slice(0,40),h:`<div class="fr"><div class="ld">Cargando…</div><iframe src="${esc(s)}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-presentation"></iframe></div>`};
}
function browser(root,w){
  root.innerHTML=`<div class="tabs"></div><div class="nav"><button aria-label="Atrás">←</button><button aria-label="Adelante">→</button><button aria-label="Recargar">⟳</button><input class="omni" placeholder="Busca en la web o escribe una URL" aria-label="Barra de direcciones"></div><div class="page"></div>`;
  const tabsEl=$('.tabs',root),om=$('.omni',root),page=$('.page',root),[back,fwd,rl]=root.querySelectorAll('.nav>button');
  let tabs=[],cur=0;
  const T=()=>tabs[cur],U=()=>T().h[T().i];
  async function ddg(u){
    const q=decodeURIComponent(u.split('q=')[1]||''),box=$('#ddgbox',page);if(!box)return;
    box.innerHTML='<small style="color:var(--mute)">Buscando…</small>';
    try{
      const r=await fetch(EP()+'/?q='+encodeURIComponent(q)),j=await r.json();
      if(j.error)throw 0;
      box.innerHTML=(j.organic_results||[]).map(x=>`<div class="res"><a data-go="${esc(x.link||'')}">${esc(x.title||x.link||'')}</a><small>${esc(x.displayed_link||x.link||'')}</small>${esc(x.snippet||'')}</div>`).join('')||'<small style="color:var(--mute)">Sin resultados.</small>';
    }catch{box.innerHTML='<small style="color:var(--mute)">No se pudo buscar ahora. Revisa tu conexión e inténtalo de nuevo.</small>'}
  }
  function newTab(u='chrome://newtab'){tabs.push({h:[u],i:0});cur=tabs.length-1;draw()}
  function go(v){const u=resolve(v),t=T();t.h=t.h.slice(0,t.i+1);t.h.push(u);t.i++;draw()}
  function draw(){
    tabsEl.innerHTML='';
    tabs.forEach((t,i)=>{const d=document.createElement('div');d.className='tab'+(i===cur?' on':'');
      const r=render(t.h[t.i]);
      d.innerHTML=`<span>${esc(r.t)}</span><button aria-label="Cerrar pestaña">✕</button>`;
      d.onclick=e=>{if(e.target.tagName==='BUTTON'){tabs.splice(i,1);if(!tabs.length)return newTab();cur=Math.min(cur,tabs.length-1)}else cur=i;draw()};
      tabsEl.appendChild(d)});
    const p=document.createElement('button');p.className='plus';p.textContent='+';p.setAttribute('aria-label','Nueva pestaña');p.onclick=()=>newTab();tabsEl.appendChild(p);
    const u=U(),r=render(u);
    page.innerHTML=r.h;page.scrollTop=0;
    const f=$('iframe',page);if(f)f.onload=()=>{const l=$('.ld',page);if(l)l.remove()};
    if(u.startsWith('chrome://search'))ddg(u);
    om.value=/^chrome:\/\/(newtab)?$/.test(u)?'':(/^chrome:/.test(u)?u:(/^https?:/.test(u)?u:'https://'+u));
    back.disabled=T().i===0;fwd.disabled=T().i>=T().h.length-1;
    const sb=$('[data-sb]',page);if(sb)sb.onkeydown=e=>{if(e.key==='Enter')go(sb.value)};
  }
  page.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
  om.addEventListener('keydown',e=>{if(e.key==='Enter'){go(om.value);om.blur()}});
  om.addEventListener('focus',()=>om.select());
  back.onclick=()=>{T().i--;draw()};fwd.onclick=()=>{T().i++;draw()};rl.onclick=draw;
  newTab();
}

function youtube(root){
  const YTKEY='';
  root.innerHTML=`<div class="yt yt-app">
    <div class="yt-top">
      <div class="yt-logo"><span style="color:#f00;font-weight:800">▶</span> YouTube</div>
      <div class="yt-top-actions"><button type="button" data-a="search" aria-label="Buscar">🔍</button></div>

      <button type="button" data-tab="shorts"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.65-3.48c.32.18.52.53.52.91v4.84c0 .38-.2.73-.52.91L10.65 21c-.32.18-.71.18-1.03 0L3.87 17.83c-.32-.18-.52-.53-.52-.91V9.08c0-.38.2-.73.52-.91l5.75-3.17c.32-.18.71-.18 1.03 0l5.75 3.17zM10 3.35 4.52 6.35 10 9.35l5.48-3L10 3.35z"/></svg><span>Shorts</span></button>
      <button type="button" data-tab="search"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Buscar</span></button>
    </nav>
  </div>`;
  const yb=$('.yb',root),inp=$('input',root),tabs=[...root.querySelectorAll('[data-tab]')],searchBar=$('.yt-searchbar',root);
  let last=[],mode='home';
  const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
  const vid=s=>{const m=String(s).match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/)||String(s).match(/^([\w-]{11})$/);return m&&m[1]};
  const setTab=t=>{
    mode=t;tabs.forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
    searchBar.hidden=t!=='search';
    yb.style.overflow=t==='shorts'?'hidden':'auto';
    if(t==='home')loadHome();
    else if(t==='shorts')loadShorts();
    else{yb.innerHTML='<div class="ym">Escribe palabras clave y pulsa Buscar.<br><small style="color:var(--mute)">Ej: MrBeast, música, tutorial Python</small></div>';setTimeout(()=>inp.focus(),50)}
  };
  tabs.forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  $('[data-a="search"]',root).onclick=()=>setTab('search');

  async function ytApi(path,params){
    const u=new URL('https://www.googleapis.com/youtube/v3/'+path);
    u.searchParams.set('key',YTKEY);
    Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
    const r=await fetch(u);const j=await r.json();
    if(j.error)throw new Error(j.error.message||'Error API');
    return j;
  }
  const mapSearch=j=>(j.items||[]).map(x=>{
    const sn=x.snippet||{};
    if(x.id&&x.id.channelId)return{type:'channel',id:x.id.channelId,title:sn.title||'',thumb:(sn.thumbnails&&(sn.thumbnails.high||sn.thumbnails.medium||sn.thumbnails.default)||{}).url||'',desc:sn.description||''};
    const id=x.id&&(x.id.videoId||(typeof x.id==='string'?x.id:null));
    if(!id)return null;
    return{type:'video',id,title:sn.title||'',channel:sn.channelTitle||'',channelId:sn.channelId||'',thumb:(sn.thumbnails&&(sn.thumbnails.medium||sn.thumbnails.high||sn.thumbnails.default)||{}).url||''};
  }).filter(Boolean);
  const mapVideos=j=>(j.items||[]).map(x=>{

const mList=async()=>(S.user?((await tx('readonly',s=>s.getAll()))||[]).filter(x=>x.user===S.user):MEM).slice().sort((a,b)=>b.ts-a.ts);

function camera(root){
  root.innerHTML=`<div class="cam ios-cam">
    <video playsinline muted autoplay></video>
    <div class="cam-side">
      <button type="button" data-a="flip" title="Cambiar cámara" class="cam-ico" aria-label="Voltear">

      </button>
    </div>

    <div class="cam-bottom">
      <div class="cam-modes">
        <button type="button" data-m="video">VIDEO</button>
        <button type="button" data-m="photo" class="on">FOTO</button>

        <button type="button" class="cam-thumb" data-a="gallery" aria-label="Galería"></button>
        <button type="button" class="cam-shutter" data-a="shutter" aria-label="Disparar"></button>
        <span class="cam-spacer"></span>
      </div>
    </div>
    <div class="ym" hidden></div>
    <div class="cgal" hidden></div>
  </div>`;
  const v=$('video',root),gal=$('.cgal',root),msg=$('.ym',root);
  const shutter=$('.cam-shutter',root),thumb=$('.cam-thumb',root);
  let mode='photo',facing='user',st=null,rec=null,urls=[],chunks=[],recording=false;
  const stop=()=>{if(st)st.getTracks().forEach(t=>t.stop());st=null;v.srcObject=null};
  const refreshThumb=async()=>{
    try{
      const list=await mList();
      if(list.length){const last=list[list.length-1];const u=URL.createObjectURL(last.blob);thumb.style.backgroundImage='url('+u+')';thumb.style.backgroundSize='cover';thumb.style.backgroundPosition='center'}
    }catch(e){}
  };
  const start=async()=>{
    stop();msg.hidden=true;
    try{
      st=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:mode==='video'});
      v.style.display='block';v.srcObject=st;await v.play().catch(()=>{});
      await refreshThumb();
    }catch(e){msg.hidden=false;msg.textContent='Sin permiso de cámara. Actívalo en el candado del navegador.'}
  };
  const setMode=m=>{
    mode=m;
    root.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    shutter.classList.toggle('video',m==='video');
    shutter.classList.remove('live');recording=false;if(rec){try{rec.stop()}catch(e){}}rec=null;
    start();
  };
  root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $('[data-a="flip"]',root).onclick=()=>{facing=facing==='user'?'environment':'user';start()};
  const saveBlob=async(blob,type,ext)=>{
    const name=type+'-'+Date.now()+'.'+ext;
    const item={name,type,blob,ts:Date.now()};
    await mPut(item);
    await refreshThumb();
    // brief flash
    shutter.animate([{opacity:1},{opacity:.4},{opacity:1}],{duration:200});
  };
  shutter.onclick=async()=>{
    if(mode==='photo'||mode==='square'){
      const c=document.createElement('canvas');
      const vw=v.videoWidth||1280,vh=v.videoHeight||720;
      if(mode==='square'){const s=Math.min(vw,vh);c.width=s;c.height=s;c.getContext('2d').drawImage(v,(vw-s)/2,(vh-s)/2,s,s,0,0,s,s)}
      else{c.width=vw;c.height=vh;c.getContext('2d').drawImage(v,0,0)}
      c.toBlob(async b=>{if(b)await saveBlob(b,'photo','jpg')},'image/jpeg',0.92);
      return;
    }
    if(recording){rec&&rec.stop();return}
    if(!st)return;
    chunks=[];recording=true;shutter.classList.add('live');
    try{
      rec=new MediaRecorder(st,{mimeType:'video/webm;codecs=vp9,opus'});
      rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      rec.onstop=async()=>{
        recording=false;shutter.classList.remove('live');
        const blob=new Blob(chunks,{type:'video/webm'});
        await saveBlob(blob,'video','webm');
      };
      rec.start(200);
    }catch(e){
      try{
        rec=new MediaRecorder(st);
        rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
        rec.onstop=async()=>{recording=false;shutter.classList.remove('live');await saveBlob(new Blob(chunks,{type:'video/webm'}),'video','webm')};
        rec.start(200);

    }
  };
  thumb.onclick=async()=>{
    gal.hidden=!gal.hidden;
    if(gal.hidden)return;
    urls.forEach(u=>URL.revokeObjectURL(u));urls=[];gal.innerHTML='';
    const list=await mList();
    if(!list.length){gal.innerHTML='<div class="ym">Galería vacía. Toma una foto o video.</div>';return}
    for(const m of list.slice().reverse()){
      const u=URL.createObjectURL(m.blob);urls.push(u);
      const d=document.createElement('div');
      d.style.cssText='position:relative';
      const media=m.type==='photo'?`<img src="${u}">`:m.type==='video'?`<video src="${u}" controls playsinline></video>`:`<audio src="${u}" controls></audio>`;
      d.innerHTML=media+`<span>${esc(m.name)}</span><div style="display:flex;gap:6px;padding:4px">
        <button type="button" data-dl style="flex:1;padding:6px;border-radius:8px;border:0;background:#fff;color:#111;font-size:11px">Descargar</button>
        <button type="button" data-cp style="flex:1;padding:6px;border-radius:8px;border:0;background:#333;color:#fff;font-size:11px">Copiar</button>
      </div>`;
      d.querySelector('[data-dl]').onclick=()=>{const a=document.createElement('a');a.href=u;a.download=m.name;a.click()};
      d.querySelector('[data-cp]').onclick=async()=>{
        try{
          if(m.type==='photo'){const buf=await m.blob.arrayBuffer();await navigator.clipboard.write([new ClipboardItem({[m.blob.type]:m.blob})]);alert('Copiado')}
          else{await navigator.clipboard.writeText(u);alert('Enlace copiado')}
        }catch(e){alert('No se pudo copiar')}
      };
      gal.appendChild(d);
    }
  };
  start();
  root._cleanup=()=>{stop();if(rec)try{rec.stop()}catch(e){}};
}

  let editor=null;
  const boot=()=>{
    if(window.require&&window.monaco){create();return}
    if(document.querySelector('script[data-monaco]')){
      const wait=setInterval(()=>{if(window.monaco){clearInterval(wait);create()}},100);
      setTimeout(()=>clearInterval(wait),15000);return;
    }
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js';s.dataset.monaco='1';
    s.onload=()=>{
      window.require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'}});
      window.MonacoEnvironment={getWorkerUrl:function(){
        return URL.createObjectURL(new Blob([`self.MonacoEnvironment={baseUrl:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/'};importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js');`],{type:'text/javascript'}));
      }};
      window.require(['vs/editor/editor.main'],create);
    };
    s.onerror=()=>{host.innerHTML='<div class="ym" style="color:#f88;padding:20px">No se pudo cargar Monaco desde el CDN.</div>'};
    document.head.appendChild(s);
  };
  const samples={
    javascript:'// WebOS VS Code\nfunction hello(name){\n  console.log("Hola, " + name);\n  return name.length;\n}\nhello("WebOS");\n',
    html:'<!DOCTYPE html>\n<html>\n<head><meta charset="utf-8"><title>Demo</title>\n<style>body{font-family:system-ui;padding:24px}</style>\n</head>\n<body>\n  <h1>Hola WebOS</h1>\n  <p>Edita y pulsa Ejecutar.</p>\n</body>\n</html>\n',
    python:'# Python (vista)\ndef fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        print(a)\n        a, b = b, a + b\nfib(10)\n',
    lua:'-- Lua\nlocal function greet(name)\n  print("Hola, " .. name)\nend\ngreet("WebOS")\n',
    css:'body {\n  margin: 0;\n  font-family: system-ui;\n  background: #111;\n  color: #eee;\n}\n',
    json:'{\n  "name": "webos",\n  "version": "1.0"\n}\n',
    markdown:'# WebOS\n\nEditor **Monaco** (mismo motor que VS Code).\n',
    typescript:'const msg: string = "Hola";\nconsole.log(msg);\n',
    sql:'SELECT id, name FROM users WHERE active = 1;\n',
    shell:'#!/bin/bash\necho "Hola WebOS"\n'
  };
  function create(){
    host.innerHTML='';
    const lang=$('#vslang',root).value;
    editor=monaco.editor.create(host,{
      value:samples[lang]||samples.javascript,
      language:lang,
      theme:'vs-dark',
      automaticLayout:true,
      fontSize:14,
      minimap:{enabled:true},
      scrollBeyondLastLine:false,
      tabSize:2
    });
    editor.onDidChangeCursorPosition(e=>{
      const p=e.position;$('#vspos',root).textContent='Ln '+p.lineNumber+', Col '+p.column;
    });
    $('#vslang',root).onchange=()=>{
      const l=$('#vslang',root).value;
      monaco.editor.setModelLanguage(editor.getModel(),l);
      if(!editor.getValue().trim()||Object.values(samples).includes(editor.getValue()))editor.setValue(samples[l]||'');
    };
  }
  root.querySelector('[data-a="copy"]').onclick=async()=>{
    if(!editor)return;
    try{await navigator.clipboard.writeText(editor.getValue())}catch{}
  };
  root.querySelector('[data-a="dl"]').onclick=()=>{
    if(!editor)return;
    const l=$('#vslang',root).value;
    const ext={javascript:'js',typescript:'ts',html:'html',css:'css',python:'py',lua:'lua',json:'json',markdown:'md',sql:'sql',shell:'sh'}[l]||'txt';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([editor.getValue()],{type:'text/plain'}));
    a.download='code.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2e3);
  };
  root.querySelector('[data-a="fmt"]').onclick=()=>{
    if(!editor)return;
    editor.getAction('editor.action.formatDocument')?.run();
  };
  root.querySelector('[data-a="run"]').onclick=()=>{
    if(!editor)return;
    const l=$('#vslang',root).value, code=editor.getValue();
    if(l==='html'){
      const w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes');
      w.document.write(code);w.document.close();return;
    }
    if(l==='javascript'||l==='typescript'){
      try{const r=Function('"use strict";\n'+code)();console.log('VS run:',r);alert('Ejecutado. Revisa la consola del navegador (F12).')}
      catch(e){alert('Error: '+e.message)}
      return;
    }
    alert('Ejecutar en el navegador solo para JS/TS/HTML. Para '+l+' usa copiar/descargar.');
  };
  boot();
}

/* ---- Navegador real con Scramjet (solo si el servidor Node está detrás) ---- */
const SJ=()=>typeof $scramjetLoadController==='function'&&typeof BareMux!=='undefined'&&!!navigator.serviceWorker;
let SJP=null,SJC=null;
function sjInit(){
  if(SJP)return SJP;
  SJP=(async()=>{
    if(typeof $scramjetLoadController!=='function')throw new Error('Scramjet no cargó (/scram/scramjet.all.js). ¿Estás en el servidor Node?');
    if(!navigator.serviceWorker)throw new Error('Service workers requieren https (o localhost).');
    const {ScramjetController}=$scramjetLoadController();
    SJC=new ScramjetController({files:{wasm:'/scram/scramjet.wasm.wasm',all:'/scram/scramjet.all.js',sync:'/scram/scramjet.sync.js'}});
    SJC.init();
    // mismo SW que Scramjet-App demo
    if(typeof registerSW==='function')await registerSW();
    else{await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready}
    if(typeof BareMux==='undefined')throw new Error('BareMux no cargó (/baremux/index.js)');
    const c=new BareMux.BareMuxConnection('/baremux/worker.js');
    const wisp=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/wisp/';
    if((await c.getTransport())!=='/libcurl/index.mjs')await c.setTransport('/libcurl/index.mjs',[{websocket:wisp}]);
    return SJC;
  })();
  SJP.catch(()=>{SJP=null});
  return SJP;
}
const sjStyle='position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff';
async function sjLoad(box,url){
  box.innerHTML='<div class="ym">Cargando por proxy…</div>';
  try{
    await sjInit();
    const f=SJC.createFrame();
    f.frame.style.cssText='width:100%;height:100%;min-height:70vh;border:0;border-radius:12px;background:#fff';
    box.innerHTML='';box.appendChild(f.frame);f.go(url);return f;
  }catch(e){
    const heavy=/discord|youtube|instagram|tiktok|reddit|twitter|x\.com/i.test(String(url));
    box.innerHTML='<div class="ym">No se pudo iniciar el proxy: '+esc(String(e&&e.message||e))+
      (heavy?'<br><br><b>Sitio pesado</b>: Discord/YouTube/Instagram necesitan WebOS servido con Scramjet (Node: /scram, /sw.js, /wisp). El HTML solo no alcanza.<br>YouTube: usa la app <b>YouTube</b> del escritorio.':'')+
      '</div>';
    return null;
  }
}

  function bar(force){

/* ---- Gemini sin API: Nano (Chrome) y Gemini web por proxy ---- */
async function nano(b){
  const json=(o,s=200)=>new Response(JSON.stringify(o),{status:s,headers:{'content-type':'application/json'}});
  try{
    const LM=window.LanguageModel||(window.ai&&window.ai.languageModel);
    if(!LM)return json({error:{message:'Este navegador no trae Gemini Nano. Solo Chrome de escritorio reciente (activa la Prompt API en chrome://flags).'}},500);
    if(LM.availability&&(await LM.availability())==='unavailable')return json({error:{message:'Gemini Nano no está disponible en este equipo.'}},500);
    const msgs=b.messages.map(m=>({role:m.role==='assistant'?'assistant':'user',content:typeof m.content==='string'?m.content:(m.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n')})),last=msgs.pop();
    const ses=await LM.create({initialPrompts:msgs});
    return json({content:[{type:'text',text:await ses.prompt(last.content)}]});
  }catch(e){return json({error:{message:String(e&&e.message||e)}},500)}
}

/* ---- Fondo diario estilo Windows (Bing) ---- */
(function(){
  if(window.__wosApplyDaily===false)return;
  const key='wos:wall:'+new Date().toISOString().slice(0,10);
  const apply=url=>{
    const d=document.getElementById('desk');
    if(!d||!url)return;
    d.style.backgroundImage='url("'+url+'")';
    d.style.backgroundSize='cover';
    d.style.backgroundPosition='center';
    d.style.backgroundRepeat='no-repeat';
  };
  try{const c=localStorage.getItem(key);if(c){apply(c);return}}catch(e){}
  fetch('https://bing.biturl.top/?resolution=1920&format=json&index=0&mkt=es-ES')
    .then(r=>r.json()).then(j=>{
      if(window.__wosApplyDaily===false)return;
      const u=j&&(j.url||j.image)||'';
      if(u){try{localStorage.setItem(key,u)}catch(e){}apply(u)}
    }).catch(()=>{
      if(window.__wosApplyDaily===false)return;
      fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY')
        .then(r=>r.json()).then(j=>{if(j&&j.url&&j.media_type==='image'){try{localStorage.setItem(key,j.url)}catch(e){}apply(j.url)}}).catch(()=>{});
    });
})();
